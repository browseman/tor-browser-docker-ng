[supervisord]
nodaemon=true

[program:xvnc]
command=/usr/bin/Xvnc %(ENV_DISPLAY)s -geometry %(ENV_RES)s -SecurityTypes None -noreset -ac -dpms
autorestart=true

[program:fluxbox]
command=/usr/bin/fluxbox
autorestart=true

[program:novnc]
command=/usr/share/novnc/utils/novnc_proxy --vnc localhost:5900 --listen 8080
autorestart=true

[program:firefox]
command=/usr/bin/firefox
autorestart=false

[program:torbrowser]
command=/usr/bin/torbrowser-launcher
user=browseruser
environment=HOME="/home/browseruser",USER="browseruser"
autostart=true
autorestart=false

